name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        working-directory: agent-qualification-isac
        run: pip install -r requirements.txt

      - name: Lancer les tests (hors tests API payants)
        working-directory: agent-qualification-isac
        run: pytest tests/ -v -m "not api"
